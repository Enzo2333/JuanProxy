name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: remote-monitor/go.mod
          cache-dependency-path: remote-monitor/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test remote monitor
        working-directory: remote-monitor
        run: go test ./...
