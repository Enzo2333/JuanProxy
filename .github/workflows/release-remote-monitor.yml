name: Release Remote Codex Monitor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: remote-monitor/go.mod
          cache-dependency-path: remote-monitor/go.mod

      - name: Test monitor
        working-directory: remote-monitor
        run: go test ./...

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist/windows-x64 dist/macos-apple-silicon dist/macos-intel

          cd remote-monitor
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${version}" -o ../dist/windows-x64/JuanProxy-Remote-Codex-Monitor.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o ../dist/macos-apple-silicon/JuanProxy-Remote-Codex-Monitor .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o ../dist/macos-intel/JuanProxy-Remote-Codex-Monitor .
          cd ..

          cp scripts/install-remote-codex-monitor.command dist/macos-apple-silicon/Install-JuanProxy-Remote-Monitor.command
          cp scripts/install-remote-codex-monitor.command dist/macos-intel/Install-JuanProxy-Remote-Monitor.command
          chmod +x dist/macos-*/*

          printf 'Double-click JuanProxy-Remote-Codex-Monitor.exe to install and start.\n' > dist/windows-x64/README.txt
          printf 'Double-click Install-JuanProxy-Remote-Monitor.command to install and start.\n' > dist/macos-apple-silicon/README.txt
          cp dist/macos-apple-silicon/README.txt dist/macos-intel/README.txt

          (cd dist/windows-x64 && zip -9 -r ../JuanProxy-Remote-Codex-Monitor-Windows-x64.zip .)
          (cd dist/macos-apple-silicon && zip -9 -r ../JuanProxy-Remote-Codex-Monitor-macOS-Apple-Silicon.zip .)
          (cd dist/macos-intel && zip -9 -r ../JuanProxy-Remote-Codex-Monitor-macOS-Intel.zip .)
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/JuanProxy-Remote-Codex-Monitor-Windows-x64.zip
            dist/JuanProxy-Remote-Codex-Monitor-macOS-Apple-Silicon.zip
            dist/JuanProxy-Remote-Codex-Monitor-macOS-Intel.zip
            dist/SHA256SUMS.txt
